<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>严格 CSP 外部样式演示 — AccessibilityTool</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/demo.css" />
    <script defer src="/accessibility-tool.min.js"></script>
    <script defer src="/demos/csp.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">A11Y / TOOL</a>
      <span>style-src 'self'</span>
      <button class="launch-button" id="open-tool" type="button">打开工具</button>
    </header>
    <main class="chapter__body" data-a11y-region="content" data-a11y-label="CSP 演示正文">
      <p class="eyebrow">External stylesheet mode</p>
      <h1>严格 CSP，不使用内联工具栏样式。</h1>
      <p class="lede">本页通过 <code>toolbar.styleUrl</code> 加载构建产物 <code>accessibility-tool.css</code>。</p>
      <pre><code>AccessibilityTool.configure({
  toolbar: {
    styleUrl: "/accessibility-tool.css"
  }
});</code></pre>
      <p><a href="/">返回完整演示</a></p>
    </main>
  </body>
</html>
